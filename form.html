<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 40px 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin: 0 0 16px 0;
            font-size: 32px;
        }

        label.judul {
            display: block;
            font-weight: bold;
            font-size: 20px;
            margin: 14px 0 8px 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #cccccc;
            border-radius: 6px;
        }

        .tanggal {
            position: relative;
        }

        .tanggal input[type="text"] {
            padding-right: 44px;
        }

        #btn_kalender {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            margin: 0;
            padding: 0 12px;
            font-size: 18px;
            background: transparent;
            color: #000000;
            border: none;
        }

        #btn_kalender:hover {
            background: transparent;
        }

        #tanggal_picker {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .hobi label {
            display: block;
            font-size: 20px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .hobi input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }

        button[type="submit"] {
            margin-top: 12px;
            padding: 10px 16px;
            font-size: 20px;
            color: #ffffff;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #0069d9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Formulir Data Diri</h1>

        <form id="form_data" action="proses.php" method="POST">
            <label class="judul" for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required>

            <label class="judul" for="tanggal_tampil">Tanggal Lahir:</label>
            <div class="tanggal">
                <input type="text" id="tanggal_tampil" placeholder="dd/mm/yyyy"
                       maxlength="10" inputmode="numeric" autocomplete="off" required>
                <button type="button" id="btn_kalender" title="Pilih dari kalender">&#128197;</button>
                <input type="date" id="tanggal_picker" tabindex="-1" aria-hidden="true">
            </div>
            <input type="hidden" id="tanggal_lahir" name="tanggal_lahir">

            <label class="judul">Hobi:</label>
            <div class="hobi">
                <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
                <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
            </div>

            <button type="submit">Kirim</button>
        </form>
    </div>

    <script>
        var form    = document.getElementById("form_data");
        var tampil  = document.getElementById("tanggal_tampil");
        var picker  = document.getElementById("tanggal_picker");
        var hidden  = document.getElementById("tanggal_lahir");
        var tombol  = document.getElementById("btn_kalender");

        function tanggalValid(d, m, y) {
            var t = new Date(y, m - 1, d);
            return t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d;
        }

        tampil.addEventListener("input", function () {
            var angka = tampil.value.replace(/\D/g, "").substring(0, 8);
            var hasil = angka;
            if (angka.length > 4) {
                hasil = angka.substring(0, 2) + "/" + angka.substring(2, 4) + "/" + angka.substring(4);
            } else if (angka.length > 2) {
                hasil = angka.substring(0, 2) + "/" + angka.substring(2);
            }
            tampil.value = hasil;
            tampil.setCustomValidity("");
        });

        tombol.addEventListener("click", function () {
            try {
                picker.showPicker();
            } catch (e) {
                picker.focus();
            }
        });

        picker.addEventListener("change", function () {
            if (picker.value) {
                var p = picker.value.split("-");
                tampil.value = p[2] + "/" + p[1] + "/" + p[0];
                tampil.setCustomValidity("");
            }
        });

        form.addEventListener("submit", function (e) {
            var cocok = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(tampil.value);
            if (!cocok || !tanggalValid(+cocok[1], +cocok[2], +cocok[3])) {
                e.preventDefault();
                tampil.setCustomValidity("Isi tanggal dengan format dd/mm/yyyy yang valid.");
                tampil.reportValidity();
                return;
            }
            hidden.value = cocok[3] + "-" + cocok[2] + "-" + cocok[1];
        });
    </script>
</body>
</html>
